name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        shell: bash
        run: |
          cat > /tmp/sample.json <<'EOF'
          [{"name":"SQLite","url":"https://sqlite.org/","category":"Databases","purpose":"Embedded database with FTS5 search."}]
          EOF
          python forai_search.py index /tmp/sample.json --db /tmp/forai.db
          python forai_search.py search "sqlite" --db /tmp/forai.db
          python forai_search.py stats --db /tmp/forai.db



























